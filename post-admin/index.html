<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ディズニーAI投稿管理</title>

    <style>
        body {
            font-family: sans-serif;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            background: #f7f7f7;
            color: #333;
        }

        h1 {
            margin-bottom: 30px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }

        #loadButton {
            background: #333;
            color: white;
        }

        #postButton {
            background: #1d9bf0;
            color: white;
            margin-top: 20px;
        }

        #saveButton {
            background: #087f23;
            color: white;
            margin-top: 10px;
        }

        #rejectButton {
            background: #c0392b;
            color: white;
            margin-top: 10px;
            margin-left: 10px;
        }

        #postButton:disabled,
        #loadButton:disabled,
        #saveButton:disabled,
        #rejectButton:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .label {
            font-weight: bold;
            margin-top: 15px;
        }

        .post-text {
            white-space: pre-wrap;
            background: #f1f1f1;
            padding: 15px;
            border-radius: 5px;
            margin-top: 5px;
        }

        .post-text-edit {
            width: 100%;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 15px;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
            margin-top: 5px;
            resize: vertical;
            min-height: 100px;
        }

        .loading {
            margin-top: 20px;
        }

        .error {
            color: #c00;
            margin-top: 20px;
        }

        .success {
            color: #087f23;
            margin-top: 20px;
            font-weight: bold;
        }

        .warning {
            color: #9a6700;
            margin-top: 20px;
        }

        .post-result {
            margin-top: 20px;
            padding: 15px;
            background: #eef7ff;
            border-radius: 5px;
        }

        .save-message {
            margin-top: 8px;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <h1>ディズニーAI投稿管理</h1>

    <button id="loadButton">
        投稿候補を取得
    </button>

    <div id="message"></div>

    <div id="candidate"></div>

    <script>
        // =========================================================
        // API URL
        // =========================================================

        // getPostCandidates
        const GET_CANDIDATES_API_URL =
            "https://disney-vacancy-func-001-f2dcc2fpg7drfebj.japanwest-01.azurewebsites.net/api/getPostCandidates?code=RGZdXNQeT1C6YJzygPlhpkcyLUhgmSesuBaMmxYFGQXLAzFuDnNJRg==";


        // postToX
        const POST_TO_X_API_URL =
            "https://disney-vacancy-func-001-f2dcc2fpg7drfebj.japanwest-01.azurewebsites.net/api/postToX?code=cBayFW59h0cV0BBB4Nu-pduiPkWrj7wglhi9WwgCkDgNAzFu7syghA==";


        // updatePostText
        // ★ここをupdatePostTextデプロイ後に発行されるFunction Keyに変更してください
        // postTextの更新・却下（status更新）の両方をこのFunctionで担う
        const UPDATE_POST_TEXT_API_URL =
            "https://disney-vacancy-func-001-f2dcc2fpg7drfebj.japanwest-01.azurewebsites.net/api/updatePostText?code=RC_FAk7t8fip6czE0AH68qMW6tJUJgEnxNZkyDsxzIVSAzFuYIsh5A==";


        // =========================================================
        // DOM
        // =========================================================

        const loadButton =
            document.getElementById("loadButton");

        const message =
            document.getElementById("message");

        const candidate =
            document.getElementById("candidate");


        // =========================================================
        // 現在表示している投稿候補
        // =========================================================

        let currentCandidate = null;


        // =========================================================
        // 投稿候補取得
        // =========================================================

        loadButton.addEventListener("click", async () => {

            message.innerHTML =
                '<div class="loading">投稿候補を取得中...</div>';

            candidate.innerHTML = "";

            currentCandidate = null;

            loadButton.disabled = true;

            try {

                const response =
                    await fetch(GET_CANDIDATES_API_URL);

                if (!response.ok) {
                    throw new Error(
                        `HTTPエラー: ${response.status}`
                    );
                }

                const data =
                    await response.json();


                // -------------------------------------------------
                // 投稿候補がない場合
                // -------------------------------------------------

                if (
                    !data.candidates ||
                    data.candidates.length === 0
                ) {

                    message.innerHTML =
                        "<p>投稿候補はありません。</p>";

                    return;
                }


                // -------------------------------------------------
                // 最新の候補を取得
                // -------------------------------------------------

                const item =
                    data.candidates[0];

                currentCandidate = item;


                message.innerHTML =
                    `<p>投稿候補を取得しました。</p>`;


                // -------------------------------------------------
                // 投稿候補表示
                // -------------------------------------------------

                candidate.innerHTML = `

                    <div class="card">

                        <div class="label">
                            キーワード
                        </div>

                        <div>
                            ${escapeHtml(item.keyword || "")}
                        </div>


                        <div class="label">
                            商品
                        </div>

                        <div>
                            ${escapeHtml(item.productName || "")}
                        </div>


                        <div class="label">
                            価格
                        </div>

                        <div>
                            ${escapeHtml(
                                String(item.productPrice || "")
                            )}円
                        </div>


                        <div class="label">
                            ショップ
                        </div>

                        <div>
                            ${escapeHtml(item.shopName || "")}
                        </div>


                        <div class="label">
                            選定理由
                        </div>

                        <div>
                            ${escapeHtml(
                                item.selectionReason || ""
                            )}
                        </div>


                        <div class="label">
                            投稿文（編集可能）
                        </div>

                        <textarea
                            id="postTextArea"
                            class="post-text-edit"
                        >${escapeHtml(
                            item.postText || ""
                        )}</textarea>

                        <button
                            id="saveButton"
                            type="button"
                        >
                            投稿文を保存
                        </button>

                        <div
                            id="saveMessage"
                            class="save-message"
                        ></div>


                        <div class="label">
                            商品URL
                        </div>

                        <div>
                            <a
                                href="${escapeHtml(
                                    item.productUrl || ""
                                )}"
                                target="_blank"
                                rel="noopener"
                            >
                                商品ページを開く
                            </a>
                        </div>


                        <div class="label">
                            投稿候補ID
                        </div>

                        <div>
                            ${escapeHtml(
                                item.candidateId || ""
                            )}
                        </div>


                        <button
                            id="postButton"
                            type="button"
                        >
                            Xに投稿する
                        </button>

                        <button
                            id="rejectButton"
                            type="button"
                        >
                            却下する
                        </button>

                    </div>
                `;


                // -------------------------------------------------
                // 投稿ボタン
                // -------------------------------------------------

                const postButton =
                    document.getElementById("postButton");


                postButton.addEventListener(
                    "click",
                    postCandidate
                );


                // -------------------------------------------------
                // 却下ボタン
                // -------------------------------------------------

                const rejectButton =
                    document.getElementById("rejectButton");


                rejectButton.addEventListener(
                    "click",
                    rejectCandidate
                );


                // -------------------------------------------------
                // 保存ボタン
                // -------------------------------------------------

                const saveButton =
                    document.getElementById("saveButton");


                saveButton.addEventListener(
                    "click",
                    savePostText
                );


            } catch (error) {

                console.error(error);

                message.innerHTML = `
                    <div class="error">
                        投稿候補の取得に失敗しました。<br>
                        ${escapeHtml(error.message)}
                    </div>
                `;

            } finally {

                loadButton.disabled = false;

            }

        });


        // =========================================================
        // 投稿文の保存
        // =========================================================

        async function savePostText() {

            if (!currentCandidate) {

                showSaveMessage(
                    "投稿候補が選択されていません。",
                    "error"
                );

                return;
            }


            const candidateId =
                currentCandidate.candidateId;


            if (!candidateId) {

                showSaveMessage(
                    "candidateIdが取得できませんでした。",
                    "error"
                );

                return;
            }


            const postTextArea =
                document.getElementById("postTextArea");

            const newPostText =
                postTextArea.value;


            if (newPostText.trim() === "") {

                showSaveMessage(
                    "投稿文を入力してください。",
                    "error"
                );

                return;
            }


            const saveButton =
                document.getElementById("saveButton");


            if (saveButton) {
                saveButton.disabled = true;
                saveButton.textContent =
                    "保存中...";
            }


            showSaveMessage(
                "保存しています...",
                ""
            );


            try {

                const response =
                    await fetch(UPDATE_POST_TEXT_API_URL, {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            candidateId: candidateId,
                            postText: newPostText
                        })
                    });


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        data.error ||
                        `HTTPエラー: ${response.status}`
                    );

                }


                // -------------------------------------------------
                // 保存成功：画面上の状態も更新
                // -------------------------------------------------

                currentCandidate.postText =
                    newPostText;


                showSaveMessage(
                    "投稿文を保存しました。",
                    "success"
                );


            } catch (error) {

                console.error(error);

                showSaveMessage(
                    "保存に失敗しました：" +
                    error.message,
                    "error"
                );

            } finally {

                if (saveButton) {
                    saveButton.disabled = false;
                    saveButton.textContent =
                        "投稿文を保存";
                }

            }

        }


        // =========================================================
        // 保存結果メッセージ表示
        // =========================================================

        function showSaveMessage(text, type) {

            const saveMessage =
                document.getElementById("saveMessage");

            if (!saveMessage) {
                return;
            }

            saveMessage.className =
                "save-message" +
                (type ? " " + type : "");

            saveMessage.textContent =
                text;

        }


        // =========================================================
        // 候補の却下
        // =========================================================

        async function rejectCandidate() {

            if (!currentCandidate) {

                message.innerHTML = `
                    <div class="error">
                        投稿候補が選択されていません。
                    </div>
                `;

                return;
            }


            const candidateId =
                currentCandidate.candidateId;


            if (!candidateId) {

                message.innerHTML = `
                    <div class="error">
                        candidateIdが取得できませんでした。
                    </div>
                `;

                return;
            }


            const confirmed =
                window.confirm(
                    "この投稿候補を却下します。\n" +
                    "却下した商品は今後の候補生成でも除外されます。\n\n" +
                    "よろしいですか？"
                );


            if (!confirmed) {
                return;
            }


            const rejectButton =
                document.getElementById("rejectButton");

            const postButton =
                document.getElementById("postButton");

            const saveButton =
                document.getElementById("saveButton");


            if (rejectButton) {
                rejectButton.disabled = true;
                rejectButton.textContent =
                    "却下中...";
            }


            message.innerHTML =
                '<div class="loading">却下しています...</div>';


            try {

                const response =
                    await fetch(UPDATE_POST_TEXT_API_URL, {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: JSON.stringify({
                            candidateId: candidateId,
                            status: "Rejected"
                        })
                    });


                const data =
                    await response.json();


                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        data.error ||
                        `HTTPエラー: ${response.status}`
                    );

                }


                message.innerHTML = `
                    <div class="success">
                        投稿候補を却下しました。
                        「投稿候補を取得」から次の候補を確認してください。
                    </div>
                `;


                currentCandidate.status = "Rejected";


                if (postButton) {
                    postButton.disabled = true;
                }

                if (saveButton) {
                    saveButton.disabled = true;
                }

                if (rejectButton) {
                    rejectButton.disabled = true;
                    rejectButton.textContent =
                        "却下済み";
                }


            } catch (error) {

                console.error(error);

                message.innerHTML = `
                    <div class="error">
                        却下に失敗しました。<br>
                        ${escapeHtml(error.message)}
                    </div>
                `;

                if (rejectButton) {
                    rejectButton.disabled = false;
                    rejectButton.textContent =
                        "却下する";
                }

            }

        }


        // =========================================================
        // X投稿
        // =========================================================

        async function postCandidate() {

            if (!currentCandidate) {

                message.innerHTML = `
                    <div class="error">
                        投稿候補が選択されていません。
                    </div>
                `;

                return;
            }


            const candidateId =
                currentCandidate.candidateId;


            if (!candidateId) {

                message.innerHTML = `
                    <div class="error">
                        candidateIdが取得できませんでした。
                    </div>
                `;

                return;
            }


            // -----------------------------------------------------
            // 投稿前確認（保存済みの最新postTextを使用）
            // -----------------------------------------------------

            const confirmed =
                window.confirm(
                    "以下の投稿をXへ投稿します。\n\n" +
                    currentCandidate.postText +
                    "\n\n投稿してよろしいですか？"
                );


            if (!confirmed) {
                return;
            }


            const postButton =
                document.getElementById("postButton");


            if (postButton) {
                postButton.disabled = true;
                postButton.textContent =
                    "Xへ投稿中...";
            }


            message.innerHTML =
                '<div class="loading">Xへ投稿しています...</div>';


            try {

                // -------------------------------------------------
                // postToX呼び出し
                // -------------------------------------------------

                const url =
                    POST_TO_X_API_URL +
                    "&candidateId=" +
                    encodeURIComponent(candidateId);


                const response =
                    await fetch(url, {
                        method: "POST"
                    });


                const data =
                    await response.json();


                // -------------------------------------------------
                // HTTPエラー
                // -------------------------------------------------

                if (!response.ok) {

                    throw new Error(
                        data.detail ||
                        data.error ||
                        `HTTPエラー: ${response.status}`
                    );

                }


                // -------------------------------------------------
                // 成功
                // -------------------------------------------------

                message.innerHTML = `
                    <div class="success">
                        Xへの投稿に成功しました。
                    </div>

                    <div class="post-result">

                        <strong>
                            投稿結果
                        </strong>

                        <br><br>

                        candidateId：
                        ${escapeHtml(
                            data.candidateId || candidateId
                        )}

                        <br>

                        Tweet ID：
                        ${escapeHtml(
                            data.tweetId || "なし"
                        )}

                        <br>

                        ステータス：
                        ${escapeHtml(
                            data.status || "Posted"
                        )}

                    </div>
                `;


                // -------------------------------------------------
                // 現在の候補をPostedとして扱う
                // -------------------------------------------------

                currentCandidate.status = "Posted";


                if (postButton) {

                    postButton.disabled = true;

                    postButton.textContent =
                        "投稿済み";

                }


            } catch (error) {

                console.error(error);


                message.innerHTML = `
                    <div class="error">

                        Xへの投稿に失敗しました。<br><br>

                        ${escapeHtml(
                            error.message
                        )}

                    </div>
                `;


                if (postButton) {

                    postButton.disabled = false;

                    postButton.textContent =
                        "もう一度Xに投稿する";

                }

            }

        }


        // =========================================================
        // HTMLエスケープ
        // =========================================================

        function escapeHtml(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }

    </script>
</body>
</html>
